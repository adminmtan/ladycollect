name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'        # 例如 v0.1.0
  workflow_dispatch:      # 手动触发，方便 ad-hoc 推

env:
  # 换成 GitHub Container Registry，无需 Docker Hub 账号
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/ladycollect
  BUILDKIT_PROGRESS: plain
  PROGRESS_NO_TRUNC: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 必须！允许 push 到 ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main 分支：latest + 不可变 main-<sha>（便于精确回滚）
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long,prefix=main-
            # semver tag 触发（如 v0.1.0）→ 打 v0.1.0 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Crawler Panel
            org.opencontainers.image.description=1mei.live 采集管理面板
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=main-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "=========================================="
          echo " 已推送镜像"
          echo "=========================================="
          echo "Tags：${{ steps.meta.outputs.tags }}"
          echo "Digest：${{ steps.meta.outputs.digest }}"
          echo ""
          echo "Commit：${{ github.sha }}"
          echo ""
          echo "=========================================="
          echo " NAS 上精确拉取命令（按 SHA，永不歧义）"
          echo "=========================================="
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ github.sha }}"
          echo "  docker compose pull && IMAGE_TAG=main-${{ github.sha }} docker compose up -d --force-recreate"
