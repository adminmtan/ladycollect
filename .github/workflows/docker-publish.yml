name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'        # 例如 v0.1.0
  workflow_dispatch:      # 手动触发，方便 ad-hoc 推

env:
  REGISTRY: docker.io
  # Docker Hub 镜像名 = <hub user>/<repo>，默认 root namespace 即可
  IMAGE_NAME: adminmtan/ladycollect

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 主分支推送 → :latest + :main-<sha>
            # enable 用 GitHub Actions 表达式 (带 $ 前缀)，
            # 结果会是字符串 'true' 或 'false'，metadata-action 校验通过。
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short,prefix=main
            # git tag 推送 (v0.1.0) → :0.1.0, :0.1, :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Crawler Panel
            org.opencontainers.image.description=1mei.live 采集管理面板
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 多架构按需打开；首次发布建议仅 amd64，节省时间
          platforms: linux/amd64
          # 推送层缓存到 Docker Hub 加速二次构建
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "已推送：${{ steps.meta.outputs.tags }}"
          echo "Digest：${{ steps.meta.outputs.digest }}"
