name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'        # 例如 v0.1.0
  workflow_dispatch:      # 手动触发，方便 ad-hoc 推

env:
  REGISTRY: ghcr.io
  # 镜像名 = ghcr.io/<owner>/<repo>
  # github.repository 形如 "adminmtan/ladycollect"，正好是 GHCR 镜像路径
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # 推 GHCR 必须
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # 用仓库自带的 GITHUB_TOKEN 即可，不需要额外 secret
        # 用 curl 走 /users/login 而不是 docker/login-action，是因
        # docker/login-action@v3 触发 GHCR /auth 时经常 429，
        # 而 curl + 显式重试更稳。
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Logging in to ${{ env.REGISTRY }} as ${REGISTRY_USER}..."
          for i in 1 2 3 4 5; do
            if echo "${REGISTRY_TOKEN}" | docker login "${{ env.REGISTRY }}" -u "${REGISTRY_USER}" --password-stdin; then
              echo "Login OK on attempt ${i}"
              exit 0
            fi
            echo "Login attempt ${i} failed, retrying in $((i * 10))s..."
            sleep $((i * 10))
          done
          echo "::error::Failed to log in to GHCR after 5 attempts"
          exit 1

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 主分支 → :latest + :main-<sha>
            # enable 值必须用引号包住，metadata-action 才认
            type=raw,value=latest,enable="{{is_default_branch}}"
            type=sha,format=short,prefix=main
            # git tag (v0.1.0) → :0.1.0, :0.1, :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable="{{is_tag}}"
          labels: |
            org.opencontainers.image.title=Crawler Panel
            org.opencontainers.image.description=1mei.live 采集管理面板
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 多架构按需打开；首次发布建议仅 amd64，节省时间
          platforms: linux/amd64
          # 推送层缓存到 GHCR 加速二次构建
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "已推送：${{ steps.meta.outputs.tags }}"
          echo "Digest：${{ steps.meta.outputs.digest }}"
