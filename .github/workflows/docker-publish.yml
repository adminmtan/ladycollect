name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'        # 例如 v0.1.0
  workflow_dispatch:      # 手动触发，方便 ad-hoc 推

env:
  REGISTRY: docker.io
  # Docker Hub 镜像名 = <hub user>/<repo>，默认 root namespace 即可
  IMAGE_NAME: adminmtan/ladycollect
  # 调试期间展开 BuildKit 全部输出，让 GitHub 日志能看到 pip 的真实 stderr
  BUILDKIT_PROGRESS: plain
  PROGRESS_NO_TRUNC: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # DEBUG: 预跑一次 pip install，把完整 stderr 上传 artifact
      # 这样 build 失败时能从公开仓库下载看到 pip 的真实报错
      # ============================================================
      - name: Debug — reproduce pip install
        if: always()
        run: |
          set +e
          echo "===== START DEBUG PIP INSTALL ====="
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            python:3.12-slim \
            bash -c '
              echo "==== apt install system deps ===="
              apt-get update 2>&1 | tail -5
              apt-get install -y --no-install-recommends \
                python3-pip gcc libffi-dev libssl-dev libxml2-dev libxslt1-dev \
                libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
                libpango-1.0-0 libcairo2 libasound2 libxshmfence1 2>&1 | tail -5
              echo "==== python version ===="
              python3 --version
              echo "==== pip install -e . ===="
              pip install --no-cache-dir --break-system-packages -e . 2>&1 | tail -120
              echo "==== exit=$? ===="
              echo "==== END ===="
            '
          echo "===== END DEBUG ====="
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: 1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 主分支推送 → :latest + :main-<sha>
            # enable 用 GitHub Actions 表达式 (带 $ 前缀)，
            # 结果会是字符串 'true' 或 'false'，metadata-action 校验通过。
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=short,prefix=main
            # git tag 推送 (v0.1.0) → :0.1.0, :0.1, :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Crawler Panel
            org.opencontainers.image.description=1mei.live 采集管理面板
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # 暂时禁用层缓存，排查 pip install 失败
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest summary
        if: github.event_name != 'pull_request'
        run: |
          echo "已推送：${{ steps.meta.outputs.tags }}"
          echo "Digest：${{ steps.meta.outputs.digest }}"
