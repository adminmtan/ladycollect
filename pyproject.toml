[project]
name = "crawler-panel"
version = "0.1.0"
description = "1mei.live 采集管理面板后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "DrissionPage>=4.1.0",
    "websockets>=13.0",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    # cloakbrowser 直接依赖 cryptography + httpx + playwright（pip show cloakbrowser）；
    # Dockerfile 用 --no-deps 装 cloakbrowser（resolver 冲突，见 46ab4db），
    # 所以这三个必须显式声明在主依赖里：
    # - playwright: cloakbrowser 启动浏览器时 lazy import，缺了 No module named 'playwright'
    # - cryptography: Playwright 启动 Browser 时 lazy import cryptography.x509 (TLS 证书)
    #                缺了 No module named 'cryptography'（生产环境 sehuatang 任务 fail，
    #                见 2026-10-01T09:12 job#7 日志）
    # - httpx: cloakbrowser 网络层依赖
    # 本地 venv 之前一直能跑是因为 playwright 拖带了 cryptography，pyproject 没声明 + Docker
    # 全新构建导致镜像里 cryptography 完全缺失。
    "cryptography>=41.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py311"
